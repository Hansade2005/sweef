name: codeql

# TODO(owner): pin every `uses:` by full commit SHA before the first public release (same as ci.yml).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (go, javascript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
      # List the findings in the job log too (the code-scanning UI is not visible to every reviewer or tool).
      - name: list findings
        if: always()
        run: |
          for f in sarif-results/*.sarif; do
            [ -f "$f" ] || continue
            jq -r '.runs[].results[] | "\(.level // "warning") \(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text | gsub("\n"; " ") | .[0:200]) \((.relatedLocations // []) | map("[\(.id)] \(.physicalLocation.artifactLocation.uri):\(.physicalLocation.region.startLine)") | join(" "))"' "$f"
          done
