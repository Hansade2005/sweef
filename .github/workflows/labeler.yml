name: labeler
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs with write access: it only reads the base branch's labeler.yml and never checks out PR code.
      - uses: actions/labeler@v7
        with:
          sync-labels: true
