name: release

# Release pipeline for Sweef: test, cross-compile (pure Go, CGO_ENABLED=0), package every format,
# sign when secrets exist, checksum, attest provenance, publish a GitHub PRE-release (always "alpha").
#
# Trigger: push of a tag v* (e.g. v0.1.0-alpha.3), or run manually (workflow_dispatch).
# A manual run only publishes when `publish` is ticked; otherwise it just builds and uploads workflow artifacts.
#
# TODO(owner): pin every `uses:` below by full commit SHA (tag in a trailing comment) before the first public
# release. Major tags are used now because commit SHAs could not be looked up when this file was written.
#
# Secrets (all optional; missing ones skip that signing step with a loud warning, see docs/install.md):
#   MACOS_CERT_P12, MACOS_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD,
#   WINDOWS_CERT_PFX, WINDOWS_CERT_PASSWORD, UPDATE_SIGNING_KEY

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (default: from tag, else 0.1.0-alpha.<commit count>)"
        required: false
        type: string
      publish:
        description: "Create the GitHub pre-release and update latest.json"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
      epoch: ${{ steps.v.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4          # TODO: pin by SHA
        with:
          fetch-depth: 0
      - id: v
        env:
          VERSION: ${{ inputs.version }}
        run: |
          . scripts/release/lib.sh
          resolve_all
          {
            echo "version=$VERSION"
            echo "commit=$COMMIT"
            echo "epoch=$SOURCE_DATE_EPOCH"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION ($COMMIT)" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test (${{ matrix.os }})
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4          # TODO: pin by SHA
      - uses: actions/setup-go@v5          # TODO: pin by SHA
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - name: go test (short, FATE-gated tests excluded)
        run: go test -short -count=1 -timeout 20m ./...

  build:
    needs: [meta, test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      COMMIT: ${{ needs.meta.outputs.commit }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
      STRICT_VERSION: "1"
    steps:
      - uses: actions/checkout@v4          # TODO: pin by SHA
      - uses: actions/setup-go@v5          # TODO: pin by SHA
        with:
          go-version-file: go.mod
          cache: true
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Reproducibility check (two cold builds must be byte-identical)
        run: DIST=${{ runner.temp }}/repro scripts/release/build.sh --check-repro --targets "linux/amd64 windows/amd64 darwin/arm64"
      - name: Cross-compile all targets
        run: scripts/release/build.sh
      - uses: actions/upload-artifact@v4   # TODO: pin by SHA
        with:
          name: bin
          path: |
            dist/bin
            dist/icons
          if-no-files-found: error

  package-linux-windows:
    needs: [meta, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      COMMIT: ${{ needs.meta.outputs.commit }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4          # TODO: pin by SHA
      - uses: actions/setup-go@v5          # TODO: pin by SHA
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4 # TODO: pin by SHA
        with:
          name: bin
          path: dist
      - name: Tools (rpm, NSIS, osslsigncode, desktop and AppStream validators)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm nsis osslsigncode desktop-file-utils appstream lintian librsvg2-bin zip
      - name: Package Linux (deb, rpm, AppImage, tar.gz, install.sh)
        run: scripts/release/package-all.sh --only linux
      - name: Package Windows (NSIS setup, portable zip; Authenticode if secrets exist)
        run: scripts/release/package-all.sh --only windows
      - name: Checksums for verification
        run: scripts/release/checksums.sh
      - name: Verify Linux packages
        run: scripts/release/verify.sh amd64
      - uses: actions/upload-artifact@v4   # TODO: pin by SHA
        with:
          name: packages-linux-windows
          path: |
            dist/sweef_*
            dist/install.sh
          if-no-files-found: error

  package-macos:
    needs: [meta, build]
    runs-on: macos-14
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      COMMIT: ${{ needs.meta.outputs.commit }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4          # TODO: pin by SHA
      - uses: actions/setup-go@v5          # TODO: pin by SHA
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4 # TODO: pin by SHA
        with:
          name: bin
          path: dist
      - name: Package macOS (universal .app via pure-Go lipo, sign, dmg, notarize if secrets exist)
        run: scripts/release/package-all.sh --only macos
      - name: Check the universal binary and the bundle
        run: |
          lipo -info dist/work/macos/Sweef.app/Contents/MacOS/sweef
          plutil -lint dist/work/macos/Sweef.app/Contents/Info.plist
          codesign --verify --verbose=2 dist/work/macos/Sweef.app
          hdiutil verify dist/sweef_*_darwin_universal.dmg
      - uses: actions/upload-artifact@v4   # TODO: pin by SHA
        with:
          name: packages-macos
          path: |
            dist/sweef_*_darwin_universal.dmg
            dist/sweef_*_darwin_universal.zip
          if-no-files-found: error

  release:
    needs: [meta, package-linux-windows, package-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    permissions:
      contents: write        # create the release and upload assets
      id-token: write        # keyless provenance signing
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      COMMIT: ${{ needs.meta.outputs.commit }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4          # TODO: pin by SHA
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5          # TODO: pin by SHA
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4 # TODO: pin by SHA
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: scripts/release/checksums.sh
      - name: winget and Scoop manifests (attached for maintainers to submit)
        run: packaging/windows/render-manifests.sh
      - name: Provenance attestation (SLSA build provenance)
        uses: actions/attest-build-provenance@v2   # TODO: pin by SHA
        with:
          subject-path: |
            dist/sweef_*
            dist/install.sh
            dist/SHA256SUMS
      - name: latest.json (signed with UPDATE_SIGNING_KEY when set)
        run: |
          go build -trimpath -o dist/pkgtool ./packaging/tools/pkgtool
          cd dist
          ./pkgtool manifest -o latest.json -version "$VERSION" -channel alpha -sums SHA256SUMS \
            -base-url "https://github.com/${{ github.repository }}/releases/download/v$VERSION" \
            -notes-url "https://github.com/${{ github.repository }}/releases/tag/v$VERSION" \
            -epoch "$SOURCE_DATE_EPOCH"
          rm -f pkgtool
      - name: Release notes
        run: |
          scripts/release/notes.sh > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"
        env:
          MACOS_SIGNED: ${{ secrets.MACOS_CERT_P12 != '' && secrets.APPLE_ID != '' && '1' || '0' }}
          WINDOWS_SIGNED: ${{ secrets.WINDOWS_CERT_PFX != '' && '1' || '0' }}
      - name: Create the GitHub pre-release
        shell: bash
        run: |
          files=(dist/sweef_* dist/install.sh dist/SHA256SUMS dist/latest.json dist/winget/* dist/scoop/sweef.json)
          # latest.json.sig only exists when UPDATE_SIGNING_KEY is set
          [ -f dist/latest.json.sig ] && files+=(dist/latest.json.sig)
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Sweef $VERSION (alpha)" --notes-file dist/RELEASE_NOTES.md \
            "${files[@]}"
      - name: Publish latest.json at a stable URL (rolling "updates" pre-release)
        run: |
          if ! gh release view updates --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create updates --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Update manifests (machine use)" --notes "Rolling release holding latest.json for the auto-updater. Not a download page."
          fi
          files=(dist/latest.json)
          [ -f dist/latest.json.sig ] && files+=(dist/latest.json.sig)
          gh release upload updates "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
