name: pr-title

# Pull request titles become merge titles and release notes, so they follow Conventional Commits (CONTRIBUTING.md).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional:
    name: conventional commit title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9_.,/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$re"; then
            echo "PR title does not follow Conventional Commits:"
            echo "  $TITLE"
            echo "Expected: <type>(<scope>): <summary>   e.g.  perf(ui): reuse omnibox rows"
            echo "Types: feat fix perf refactor docs test build ci chore revert"
            exit 1
          fi
