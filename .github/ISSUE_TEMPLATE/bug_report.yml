name: Bug report
description: Something is broken or behaves differently from what the docs say.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A URL or a minimal HTML page is best.
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Output of `sweef version`
    validations: {required: true}
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Linux (X11), Linux (Wayland/XWayland), macOS, Windows, other]
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Desktop browser (GUI), Page rendering, JavaScript, Networking, Media, Data Saver, Sidekick agent, CLI / MCP, Installer / packaging, other]
  - type: textarea
    id: extra
    attributes:
      label: Logs, screenshots, anything else
      description: For rendering bugs, a screenshot of Chromium next to ours helps a lot. Do not paste API keys or cookies.
