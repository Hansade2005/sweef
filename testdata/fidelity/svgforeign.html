<!doctype html>
<html><head><meta charset="utf-8"><title>svgforeign</title>
<style>
body{margin:12px;font:13px Arial,sans-serif;color:#234}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
svg{background:#f4f4f8;border:1px solid #ccd}
.card{background:#fff;border:1px solid #89a;border-radius:6px;padding:6px;box-sizing:border-box;width:100%;height:100%}
.fx{display:flex;gap:4px;width:100%;height:100%}
.fx div{flex:1;background:#fc6;text-align:center;padding-top:6px}
.fx div:nth-child(2){flex:2;background:#6cf}
</style></head><body>
<div class="row">
<svg width="260" height="150" viewBox="0 0 260 150">
<rect x="0" y="0" width="260" height="150" fill="#eef"/>
<foreignObject x="10" y="10" width="140" height="60"><div xmlns="http://www.w3.org/1999/xhtml" class="card"><b>Hello</b> foreign <i>object</i> text that wraps over lines</div></foreignObject>
<foreignObject x="160" y="10" width="90" height="40"><button xmlns="http://www.w3.org/1999/xhtml" style="width:80px">Click me</button></foreignObject>
<foreignObject x="10" y="85" width="150" height="55"><div xmlns="http://www.w3.org/1999/xhtml" class="fx"><div>A</div><div>B</div><div>C</div></div></foreignObject>
<circle cx="205" cy="105" r="30" fill="#c33" opacity=".7"/>
</svg>
<svg width="260" height="150" viewBox="0 0 130 75">
<g transform="translate(10 5) rotate(10)">
<foreignObject x="0" y="0" width="80" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:3px;background:#cfc;border:1px solid #070;font-size:10px">Rotated paragraph inside svg group</p></foreignObject>
</g>
<foreignObject x="70" y="40" width="50" height="30" style="overflow:visible"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100px;background:rgba(255,128,0,.5);font-size:9px">overflow visible text clipped?</div></foreignObject>
</svg>
<svg width="200" height="150">
<foreignObject x="10" y="10" width="180" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="width:300px;background:#ddf;font-size:11px;white-space:nowrap">clipped by foreignObject viewport box</div></foreignObject>
<foreignObject x="10" y="80" width="180" height="60"><ul xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding-left:18px;font:12px serif"><li>one</li><li>two <a href="#">link</a></li></ul></foreignObject>
</svg>
</div>
</body></html>
