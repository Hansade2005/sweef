<!doctype html>
<html><head><meta charset="utf-8"><title>xf3d_preserve</title>
<style>
body { margin: 20px; font: 14px Arial, sans-serif; background: #fff; }
.scene { display: inline-block; vertical-align: top; width: 260px; height: 200px; margin: 10px 20px; perspective: 500px; border: 1px solid #888; }
.pv { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateY(30deg) rotateX(-15deg); }
.pl { position: absolute; left: 80px; top: 50px; width: 100px; height: 100px; text-align: center; line-height: 100px; color: #fff; font-weight: bold; }
.p1 { background: rgba(200,60,60,1); transform: translateZ(40px) } .p2 { background: #3a7; transform: translateZ(0) } .p3 { background: #36c; transform: translateZ(-40px) }
.flat .pv { transform-style: flat }
.nest .pv { transform: rotateY(20deg) } .nest .grp { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(25deg) }
.mid .pv { transform: none } .mid .p1 { transform: rotateY(60deg) } .mid .p2 { transform: rotateY(-60deg); left: 100px }
.ov .pv { overflow: hidden } .op .pv { opacity: 0.9 }
.cross .p1 { transform: rotateY(60deg) } .cross .p2 { transform: none; width: 140px; left: 60px; height: 70px; top: 65px }
</style></head><body>
<div class="scene"><div class="pv"><div class="pl p3">3</div><div class="pl p2">2</div><div class="pl p1">1</div></div></div>
<div class="scene flat"><div class="pv"><div class="pl p3">3</div><div class="pl p2">2</div><div class="pl p1">1</div></div></div>
<div class="scene nest"><div class="pv"><div class="grp"><div class="pl p3">3</div><div class="pl p2">2</div><div class="pl p1">1</div></div></div></div>
<div class="scene mid"><div class="pv"><div class="pl p2">B</div><div class="pl p1">A</div></div></div>
<div class="scene ov"><div class="pv"><div class="pl p3">3</div><div class="pl p2">2</div><div class="pl p1">1</div></div></div>
<div class="scene op"><div class="pv"><div class="pl p3">3</div><div class="pl p2">2</div><div class="pl p1">1</div></div></div>
<div class="scene cross"><div class="pv"><div class="pl p2">B</div><div class="pl p1">A</div></div></div>
</body></html>
