<!doctype html>
<html><head><meta charset="utf-8"><title>xf3d_carousel</title>
<style>
body { margin: 20px; font: bold 24px Arial, sans-serif; background: #fff; }
.scene { width: 400px; height: 220px; margin: 20px auto; perspective: 1000px; border: 1px solid #aaa; position: relative; overflow: visible; }
.ring { position: absolute; width: 160px; height: 120px; left: 120px; top: 50px; transform-style: preserve-3d; transform: translateZ(-300px) rotateY(-50deg); }
.cell { position: absolute; left: 0; top: 0; width: 160px; height: 120px; border: 2px solid #222; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #fff; opacity: 1; }
.cell:nth-child(1) { background: #c33; transform: rotateY(0deg) translateZ(300px) }
.cell:nth-child(2) { background: #c83; transform: rotateY(60deg) translateZ(300px) }
.cell:nth-child(3) { background: #8a3; transform: rotateY(120deg) translateZ(300px) }
.cell:nth-child(4) { background: #3a8; transform: rotateY(180deg) translateZ(300px) }
.cell:nth-child(5) { background: #38c; transform: rotateY(240deg) translateZ(300px) }
.cell:nth-child(6) { background: #83c; transform: rotateY(300deg) translateZ(300px) }
</style></head><body>
<div class="scene"><div class="ring"><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div><div class="cell">5</div><div class="cell">6</div></div></div>
</body></html>
