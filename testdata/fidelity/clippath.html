<!doctype html>
<html><head><meta charset="utf-8"><title>clip-path basic shapes</title>
<style>
body { margin: 16px; font: 12px Arial, sans-serif; background: #fff; }
.g { display: grid; grid-template-columns: repeat(8, 150px); gap: 8px; }
.c { width: 110px; height: 80px; background: linear-gradient(135deg, #e44 0%, #fa0 50%, #26c 100%); border: 4px solid #333; padding: 8px; box-sizing: content-box; position: relative; overflow: visible; }
.c b { display: block; background: rgba(255,255,255,.8); padding: 2px; margin: 0; }
.c.sq { width: 100px; height: 100px; }
</style></head><body>
<div class="g">
<div class="c" style="clip-path: inset(10px 20px 30px 40px)"><b>inset</b></div>
<div class="c" style="clip-path: inset(10px round 20px)"><b>inset round</b></div>
<div class="c" style="clip-path: inset(5% 10% 15% 20% round 10px 30px / 5px 20px)"><b>inset pct</b></div>
<div class="c" style="clip-path: circle(50%)"><b>circle 50%</b></div>
<div class="c" style="clip-path: circle(25px at 30% 70%)"><b>circle at</b></div>
<div class="c" style="clip-path: circle(farthest-side at 0 0)"><b>circle fs</b></div>
<div class="c" style="clip-path: ellipse(40% 30% at 50% 50%)"><b>ellipse</b></div>
<div class="c" style="clip-path: ellipse(closest-side closest-side at 25% 50%)"><b>ellipse cs</b></div>
<div class="c" style="clip-path: polygon(50% 0, 100% 100%, 0 100%)"><b>triangle</b></div>
<div class="c" style="clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)"><b>star nz</b></div>
<div class="c" style="clip-path: polygon(evenodd, 50% 0%, 79% 91%, 2% 35%, 98% 35%, 21% 91%)"><b>star eo</b></div>
<div class="c" style="clip-path: polygon(nonzero, 50% 0%, 79% 91%, 2% 35%, 98% 35%, 21% 91%)"><b>star nz2</b></div>
<div class="c" style="clip-path: path('M 12 12 L 100 6 Q 125 40 90 75 C 60 95 25 80 12 12 Z')"><b>path</b></div>
<div class="c" style="clip-path: path(evenodd, 'M 6 6 H 110 V 80 H 6 Z M 30 25 H 80 V 55 H 30 Z')"><b>path eo</b></div>
<div class="c" style="clip-path: border-box"><b>border-box</b></div>
<div class="c" style="border-radius: 30px; clip-path: padding-box"><b>padding-box</b></div>
<div class="c" style="border-radius: 30px; clip-path: content-box"><b>content-box</b></div>
<div class="c" style="margin: 6px; clip-path: margin-box"><b>margin-box</b></div>
<div class="c" style="clip-path: inset(0 round 10px) content-box"><b>inset content</b></div>
<div class="c" style="clip-path: circle(50%) padding-box"><b>circle padding</b></div>
<div class="c" style="clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%)"><b>top half</b></div>
<div class="c" style="clip-path: inset(0 0 0 0)"><b>inset 0</b></div>
<div class="c" style="clip-path: none"><b>none</b></div>
<div class="c" style="clip-path: rect(6px 100px 70px 12px round 8px)"><b>rect()</b></div>
<div class="c" style="clip-path: xywh(10px 14px 70px 40px round 10px)"><b>xywh()</b></div>
<div class="c" style="transform: rotate(8deg); clip-path: circle(40px)"><b>rot circle</b></div>
<div class="c" style="opacity: .6; clip-path: polygon(0 0, 100% 20%, 80% 100%, 10% 80%)"><b>opacity</b></div>
<div class="c" style="filter: drop-shadow(4px 4px 3px #000); clip-path: inset(10px 10px 10px 10px round 20px)"><b>filter</b></div>
<div class="c" style="box-shadow: 8px 8px 0 #000; clip-path: inset(-12px)"><b>shadow</b></div>
</div>
</body></html>
