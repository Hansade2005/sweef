<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:20px;background:#fff;font:bold 14px Arial}
.scene{display:inline-block;width:260px;height:200px;margin:10px;perspective:500px;border:1px solid #888;vertical-align:top}
.pv{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.pl{position:absolute;left:80px;top:50px;width:100px;height:100px;color:#fff;text-align:center;line-height:100px}
.a{background:#c33}.b{background:#3a7;left:50px;width:160px;height:70px;top:65px}.c{background:#36c;top:20px;height:40px;left:60px;width:140px}
</style></head><body>
<div class="scene"><div class="pv" style="transform:rotateX(-20deg)"><div class="pl b">B</div><div class="pl a" style="transform:rotateY(60deg)">A</div></div></div>
<div class="scene"><div class="pv" style="transform:rotateX(-35deg) rotateY(25deg)"><div class="pl b" style="transform:rotateX(70deg)">B</div><div class="pl a" style="transform:rotateY(40deg)">A</div><div class="pl c" style="transform:rotateX(-50deg) translateZ(20px)">C</div></div></div>
<div class="scene"><div class="pv" style="transform:rotateY(-30deg)"><div class="pl a" style="transform:rotateY(60deg)">A</div><div class="pl b" style="transform:rotateY(-60deg)">B</div><div class="pl c" style="transform:rotateX(60deg)">C</div></div></div>
</body></html>
