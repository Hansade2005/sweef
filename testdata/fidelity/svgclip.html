<!doctype html>
<html><head><meta charset="utf-8"><title>svgclip</title>
<style>
body{margin:10px;font:12px Arial,sans-serif;color:#234}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
svg{background:#fff;border:1px solid #ccd}
.a{clip-path:circle(30px at 50% 50%)}
.b{clip-path:inset(10px 20px round 12px)}
.c{clip-path:polygon(50% 0,100% 100%,0 100%)}
.d{clip-path:ellipse(40% 25% at 30% 60%)}
.e{clip-path:path('M10 10 L60 10 L35 60 Z')}
.f{clip-path:circle(50%) stroke-box}
.g{clip-path:inset(0) fill-box}
.h{clip-path:circle(45% at 50% 50%) view-box}
</style></head><body>
<div class="row">
<svg width="150" height="110"><rect class="a" x="20" y="15" width="110" height="80" fill="#36c" stroke="#c33" stroke-width="12"/></svg>
<svg width="150" height="110"><rect class="b" x="20" y="15" width="110" height="80" fill="#6a3" stroke="#222" stroke-width="8"/></svg>
<svg width="150" height="110"><rect class="c" x="20" y="15" width="110" height="80" fill="#c63"/></svg>
<svg width="150" height="110"><rect class="d" x="20" y="15" width="110" height="80" fill="#a3c"/></svg>
<svg width="150" height="110"><rect class="e" x="20" y="15" width="110" height="80" fill="#3aa"/></svg>
</div>
<div class="row">
<svg width="150" height="110"><rect class="f" x="30" y="25" width="90" height="60" fill="#f93" stroke="#333" stroke-width="20"/></svg>
<svg width="150" height="110"><rect class="g" x="30" y="25" width="90" height="60" fill="#93f" stroke="#333" stroke-width="20"/></svg>
<svg width="150" height="110"><rect class="h" x="20" y="15" width="110" height="80" fill="#39f"/></svg>
<svg width="150" height="110"><g class="a" transform="translate(20 10) rotate(15)"><rect width="100" height="70" fill="#c36"/><circle cx="50" cy="35" r="20" fill="#fc3"/></g></svg>
<svg width="150" height="110"><text class="c" x="10" y="60" font-size="48" font-weight="bold" fill="#369">Clip</text></svg>
</div>
<div class="row">
<svg width="150" height="110"><circle cx="75" cy="55" r="45" fill="#2a7" style="clip-path:inset(0 50% 0 0)"/><circle cx="75" cy="55" r="45" fill="#a27" style="clip-path:inset(0 0 0 50%);opacity:.6"/></svg>
<svg width="150" height="110" viewBox="0 0 75 55"><rect class="a" x="10" y="8" width="55" height="40" fill="#c93"/></svg>
<svg width="150" height="110"><clipPath id="cp"><circle cx="75" cy="55" r="40"/></clipPath><g clip-path="url(#cp)"><rect class="c" x="20" y="10" width="110" height="90" fill="#63c"/></g></svg>
</div>
</body></html>
