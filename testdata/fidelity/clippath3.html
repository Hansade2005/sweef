<!doctype html>
<html><head><meta charset="utf-8"><title>clip-path and mask on boxes</title>
<style>
body { margin: 16px; font: 12px Arial, sans-serif; background: #fff; }
.g { display: grid; grid-template-columns: repeat(6, 200px); gap: 10px; }
.k { width: 150px; height: 100px; background: #cde; border: 3px solid #234; position: relative; }
.k b { position: absolute; left: 4px; top: 4px; background: #fff8; }
img { width: 140px; height: 100px; display: block; }
</style></head><body>
<div class="g">
<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAAAwCAYAAAChS3wfAAAAnElEQVR4nO3QMQ3DUBDA0A8sSAqisEOjZZDt9K6qB4+WLJ/7dX2euN73I7/uHx2g/QboAO03QAdovwE6QPtne+C03wAdoP0G6ADtN0AHaL8B2wOn/QboAO03QAdovwE6QPsN2B447TdAB2i/ATpA+w3QAdpvwPbAab8BOkD7DdAB2m+ADtB+A7YHTvsN0AHab4AO0H4DdID2/37AF7cJPcNeMgTKAAAAAElFTkSuQmCC" style="clip-path: circle(45px)">
<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAAAwCAYAAAChS3wfAAAAnElEQVR4nO3QMQ3DUBDA0A8sSAqisEOjZZDt9K6qB4+WLJ/7dX2euN73I7/uHx2g/QboAO03QAdovwE6QPtne+C03wAdoP0G6ADtN0AHaL8B2wOn/QboAO03QAdovwE6QPsN2B447TdAB2i/ATpA+w3QAdpvwPbAab8BOkD7DdAB2m+ADtB+A7YHTvsN0AHab4AO0H4DdID2/37AF7cJPcNeMgTKAAAAAElFTkSuQmCC" style="mask-image: radial-gradient(circle, #000 40%, transparent 70%)">
<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAAAwCAYAAAChS3wfAAAAnElEQVR4nO3QMQ3DUBDA0A8sSAqisEOjZZDt9K6qB4+WLJ/7dX2euN73I7/uHx2g/QboAO03QAdovwE6QPtne+C03wAdoP0G6ADtN0AHaL8B2wOn/QboAO03QAdovwE6QPsN2B447TdAB2i/ATpA+w3QAdpvwPbAab8BOkD7DdAB2m+ADtB+A7YHTvsN0AHab4AO0H4DdID2/37AF7cJPcNeMgTKAAAAAElFTkSuQmCC" style="border-radius: 20px; clip-path: inset(10px round 10px); object-fit: cover; width: 100px">
<svg width="140" height="100" viewBox="0 0 140 100" style="clip-path: polygon(0 0, 100% 30%, 70% 100%, 0 80%)"><rect width="140" height="100" fill="#3a6"/><circle cx="70" cy="50" r="30" fill="#fc3"/></svg>
<div class="k" style="clip-path: circle(60px); mask-image: linear-gradient(to right, #000, transparent)"><b>both</b></div>
<div class="k" style="mask-image: linear-gradient(#000, transparent)"><div class="k" style="width: 80px; height: 60px; margin: 10px; clip-path: inset(5px round 15px); background: #fc6"><b>nested</b></div></div>
<div style="display: flex; gap: 6px"><div class="k" style="width: 60px; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%)"><b>flex1</b></div><div class="k" style="width: 60px; flex: none; mask-image: radial-gradient(#000 50%, transparent 51%)"><b>flex2</b></div></div>
<table style="border-collapse: separate; border-spacing: 4px"><tr><td class="k" style="width: 70px; height: 60px; vertical-align: top; clip-path: circle(30px)">td</td><td class="k" style="width: 70px; height: 60px; vertical-align: top; mask-image: linear-gradient(135deg, #000, transparent)">td2</td></tr></table>
<div class="k" style="overflow: auto; clip-path: inset(0 round 24px)"><div style="height: 200px; background: linear-gradient(45deg, #fc0, #0cf)">scroll content</div></div>
<div class="k" style="transform: skewX(-12deg) rotate(4deg); clip-path: ellipse(40% 45%)"><b>skew</b></div>
<div style="position: relative; z-index: 0; height: 110px"><div class="k" style="position: absolute; left: 20px; top: 8px; clip-path: circle(48px at 70% 40%); z-index: 2"><b>abs z2</b></div><div class="k" style="position: absolute; left: 70px; top: 30px; background: #fa8; z-index: 1"><b>z1</b></div></div>
<div class="k" style="clip-path: inset(10px); box-shadow: inset 0 0 20px #f0f; outline: 4px solid #0a0; outline-offset: 4px"><b>outline</b></div>
<div class="k" style="mask-image: linear-gradient(#000, #000); mask-clip: padding-box; border: 8px dashed #c00; border-radius: 30px"><b>dash border</b></div>
<div class="k" style="opacity: .5; mask-image: radial-gradient(circle at 20% 20%, #000, transparent 60%); background: linear-gradient(#f00, #00f)"><b>opacity</b></div>
</div>
</body></html>
