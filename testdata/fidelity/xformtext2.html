<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}div{position:absolute;white-space:nowrap;color:#000;line-height:1;font-family:'Liberation Sans';transform-origin:0 0}.s{font-family:'Liberation Serif'}.m{font-family:'DejaVu Sans'}</style></head><body>
