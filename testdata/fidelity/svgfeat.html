<!doctype html>
<html><head><meta charset="utf-8"><title>svgfeat</title>
<style>
body{margin:12px;font:12px Arial,sans-serif;color:#234}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
svg{background:#f4f4f8;border:1px solid #ccd}
.cls{fill:#c33;stroke:#222;stroke-width:3;stroke-dasharray:6 3;stroke-linejoin:round}
.ic{width:48px;height:48px;color:#07a;fill:currentColor}
.bgsvg{width:120px;height:60px;border:1px solid #999;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Ccircle cx='10' cy='10' r='8' fill='%23e83'/%3E%3C/svg%3E") 0 0/20px 20px repeat}
.sq:hover{fill:red}
</style></head><body>
<div class="row">
<svg width="120" height="90" viewBox="0 0 120 90">
<defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f80"/><stop offset=".5" stop-color="#fe3" stop-opacity=".8"/><stop offset="1" stop-color="#08f"/></linearGradient>
<radialGradient id="rg" cx=".5" cy=".5" r=".5" fx=".3" fy=".3"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#306"/></radialGradient></defs>
<rect x="5" y="5" width="50" height="40" fill="url(#lg)" stroke="#000"/>
<circle cx="90" cy="30" r="25" fill="url(#rg)"/>
<rect x="5" y="55" width="110" height="30" rx="8" fill="url(#lg)" opacity=".6"/></svg>
<svg width="120" height="90"><defs><linearGradient id="sp" x1="0" x2=".25" gradientUnits="objectBoundingBox" spreadMethod="reflect"><stop offset="0" stop-color="#c00"/><stop offset="1" stop-color="#fc0"/></linearGradient>
<linearGradient id="sr" x1="0" x2=".3" spreadMethod="repeat"><stop offset="0" stop-color="#0a5"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
<rect x="5" y="5" width="110" height="35" fill="url(#sp)"/><rect x="5" y="48" width="110" height="35" fill="url(#sr)" transform="rotate(2 60 60)"/></svg>
<svg width="120" height="90"><defs><pattern id="pt" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#36c"/><circle cx="9" cy="9" r="3" fill="#c63"/></pattern>
<pattern id="pt2" width=".25" height=".25" patternContentUnits="objectBoundingBox"><rect width=".125" height=".125" fill="#093"/></pattern></defs>
<rect x="5" y="5" width="110" height="35" fill="url(#pt)" stroke="#333"/><rect x="5" y="48" width="110" height="35" fill="url(#pt2)"/></svg>
<svg width="120" height="90"><defs><clipPath id="cp"><circle cx="40" cy="40" r="30"/><rect x="60" y="50" width="40" height="30"/></clipPath>
<mask id="mk"><rect width="120" height="90" fill="#fff"/><circle cx="40" cy="40" r="20" fill="#000"/><rect x="70" y="10" width="30" height="30" fill="#888"/></mask></defs>
<rect width="120" height="90" fill="#3a7" clip-path="url(#cp)"/><rect width="120" height="90" fill="#a37" mask="url(#mk)" opacity=".9" transform="translate(0 0)"/></svg>
</div>
<div class="row">
<svg width="140" height="100" viewBox="0 0 140 100"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c22"/></marker>
<marker id="dot" markerWidth="4" markerHeight="4" refX="2" refY="2"><circle cx="2" cy="2" r="1.5" fill="#06c"/></marker></defs>
<path d="M10 80 C 30 10 60 10 80 50 S 120 90 130 20" fill="none" stroke="#333" stroke-width="2" marker-start="url(#ar)" marker-mid="url(#dot)" marker-end="url(#ar)"/>
<polyline points="10,95 40,70 70,95" fill="none" stroke="#080" stroke-width="2" marker-mid="url(#dot)"/></svg>
<svg width="140" height="100"><defs><filter id="bl"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="ds" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="4" dy="4" stdDeviation="2" flood-color="#000" flood-opacity=".5"/></filter>
<filter id="cm"><feColorMatrix type="saturate" values="0"/></filter>
<filter id="sh"><feOffset in="SourceAlpha" dx="5" dy="5" result="o"/><feGaussianBlur in="o" stdDeviation="2" result="b"/><feBlend in="SourceGraphic" in2="b" mode="normal"/></filter></defs>
<rect x="8" y="8" width="35" height="35" fill="#c33" filter="url(#bl)"/>
<rect x="55" y="8" width="35" height="35" fill="#36c" filter="url(#ds)"/>
<rect x="100" y="8" width="30" height="35" fill="#c3c" filter="url(#cm)"/>
<circle cx="30" cy="72" r="18" fill="#2a2" filter="url(#sh)"/>
<g filter="url(#ds)"><rect x="80" y="55" width="20" height="30" fill="#fa0"/><rect x="95" y="60" width="30" height="20" fill="#0af"/></g></svg>
<svg width="140" height="100"><defs><symbol id="sy" viewBox="0 0 10 10"><rect width="10" height="10" rx="2" fill="#6a3"/><path d="M2 5l2 2 4-4" stroke="#fff" fill="none" stroke-width="1.5"/></symbol><g id="gg"><circle r="8" fill="#e73"/><rect x="-3" y="-3" width="6" height="6" fill="#fff"/></g></defs>
<use href="#sy" x="5" y="5" width="40" height="40"/><use href="#sy" x="55" y="10" width="30" height="20"/>
<use href="#gg" x="30" y="75"/><use href="#gg" x="70" y="75" fill="#00f" transform="scale(1.5)"/></svg>
<svg width="140" height="100"><text x="5" y="20" font-size="16" fill="#123">Hello SVG</text>
<text x="70" y="45" text-anchor="middle" font-size="14" font-family="serif" fill="#a22" font-weight="bold">Middle</text>
<text x="135" y="70" text-anchor="end" font-size="12" stroke="#00a" stroke-width=".5" fill="none">End anchor</text>
<text x="5" y="90" font-size="12" fill="#333">tspan <tspan fill="#c00" font-weight="bold">red bold</tspan> <tspan dy="-3" font-size="9">sup</tspan></text></svg>
</div>
<div class="row">
<svg width="100" height="80"><rect class="cls" x="10" y="10" width="80" height="50"/></svg>
<svg class="ic" viewBox="0 0 24 24"><path d="M12 2 15 9l7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>
<svg width="100" height="80" viewBox="0 0 100 80" preserveAspectRatio="xMaxYMin meet" style="width:120px;height:60px"><rect width="100" height="80" fill="#9bd"/><circle cx="50" cy="40" r="30" fill="#fff" fill-opacity=".7" stroke="#357" stroke-width="4" stroke-dasharray="2 6" stroke-linecap="round"/></svg>
<svg width="100" height="80"><path d="M10 10h60v60h-60z M25 25h30v30h-30z" fill="#c63" fill-rule="evenodd" stroke="#000"/><path d="M80 10 L95 70" stroke="#06c" stroke-width="8" stroke-linecap="square"/><path d="M5 40 Q 25 5 45 40 T 90 40" stroke="#808" fill="none" stroke-width="2"/></svg>
<svg width="100" height="80" viewBox="0 0 100 80"><path d="M10 40 A 30 20 30 1 0 70 40 A 30 20 30 0 1 10 40" fill="#cde" stroke="#124" stroke-width="2"/><path d="M80 10 a8 8 0 1 1 0 16" fill="none" stroke="#c00" stroke-width="3" stroke-linecap="round"/><ellipse cx="85" cy="55" rx="12" ry="18" fill="none" stroke="#070" stroke-width="3" stroke-dasharray="4 2"/></svg>
</div>
<div class="row">
<img width="100" height="60" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 30'%3E%3Crect width='50' height='30' fill='%23fe8'/%3E%3Ccircle cx='25' cy='15' r='10' fill='%23c33'/%3E%3C/svg%3E" style="border:1px solid #999">
<div class="bgsvg"></div>
<img width="80" height="80" style="object-fit:contain;background:#eee" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 50'%3E%3Crect width='100' height='50' fill='%2358c'/%3E%3C/svg%3E">
<svg width="100" height="60"><g fill="#a05" stroke="#000" stroke-width="2"><g transform="translate(10 10) rotate(15)"><rect width="40" height="25"/></g><g transform="translate(60 10) skewX(20)"><rect width="30" height="25" opacity=".5"/></g></g></svg>
<svg width="100" height="60" style="mix-blend-mode:multiply"><circle cx="30" cy="30" r="22" fill="#f80" style="mix-blend-mode:multiply"/><circle cx="55" cy="30" r="22" fill="#0af" style="mix-blend-mode:multiply"/></svg>
</div>
</body></html>
