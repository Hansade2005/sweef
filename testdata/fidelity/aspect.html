<!doctype html>
<html><head><meta charset="utf-8"><title>aspect</title>
<style>
body { margin: 0; padding: 16px; font: 16px/1.4 Arial, sans-serif; }
div, img { margin-bottom: 8px; }
.a1 { width: 200px; aspect-ratio: 16/9; background: #cde; }
.a2 { width: 200px; aspect-ratio: 1; padding: 10px; background: #dec; }
.a3 { width: 200px; aspect-ratio: 1; padding: 10px; box-sizing: border-box; background: #ecd; }
.a4 { height: 80px; aspect-ratio: 3/2; background: #fed; }
.a5 { width: 300px; aspect-ratio: 4/1; min-height: 100px; background: #def; }
.a6 { width: 300px; aspect-ratio: 1/1; max-height: 90px; background: #efd; }
.a7 { width: 40%; aspect-ratio: 2; background: #fde; border: 3px solid #333; }
.i1 { width: 120px; aspect-ratio: 2/1; display: block; }
.i2 { width: 120px; aspect-ratio: auto 3/1; display: block; }
.i3 { height: 60px; aspect-ratio: 3/2; display: block; }
.i4 { width: 100px; height: auto; display: block; }
.i5 { max-width: 50px; aspect-ratio: 1/2; display: block; }
.f1 { display: flex; gap: 8px; }
.f1 > div { flex: 1; aspect-ratio: 1; background: #ccf; margin: 0; }
.f2 { display: flex; flex-direction: column; width: 160px; }
.f2 > div { aspect-ratio: 2; background: #fcc; }
.f3 { display: flex; align-items: flex-start; }
.f3 > div { width: 80px; aspect-ratio: 1.5; background: #cfc; margin: 0 8px 0 0; }
.g1 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 400px; }
.g1 > div { aspect-ratio: 1; background: #ffc; margin: 0; }
.g2 { display: grid; grid-template-columns: 100px 1fr; width: 400px; }
.g2 > div { aspect-ratio: 16/9; background: #cff; margin: 0; }
.a8 { aspect-ratio: 1; height: 50px; width: auto; display: inline-block; background: #eee; }
.a9 { aspect-ratio: 3; width: 150px; overflow: hidden; background: #fee; }
.a10 { aspect-ratio: 0.5; height: 100px; background: #eef; }
.pos { position: relative; width: 200px; background: #eee; }
.pos > div { position: absolute; left: 10px; right: 10px; aspect-ratio: 5; background: #fcf; margin: 0; }
</style></head><body>
<div class="a1">16/9</div><div class="a2">padding</div><div class="a3">border-box</div><div class="a4">height-driven</div>
<div class="a5">min-height</div><div class="a6">max-height</div><div class="a7">pct</div>
<img class="i1" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
<img class="i2" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
<img class="i3" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
<img class="i4" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
<img class="i5" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
<div class="f1"><div></div><div></div><div></div></div>
<div class="f2"><div></div><div></div></div>
<div class="f3"><div></div><div></div></div>
<div class="g1"><div></div><div></div><div></div><div></div><div></div><div></div></div>
<div class="g2"><div></div><div></div></div>
<span class="a8"></span><span class="a8"></span>
<div class="a9">overflow hidden ratio 3</div>
<div class="a10" style="width:auto;display:inline-block">half</div>
<div class="pos" style="height:100px"><div style="top:10px"></div></div>
</body></html>
