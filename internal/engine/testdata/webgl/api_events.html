<!doctype html><meta charset=utf-8><canvas id=c width=64 height=64></canvas>
<script>
function ctx(v, attrs){ var c=document.getElementById('c'); return c.getContext(v||'webgl', Object.assign({preserveDrawingBuffer:true, antialias:false}, attrs||{})); }
function J(v){ if(v===undefined) return 'undefined'; if(v===null) return 'null'; if(typeof v==='number') return String(v); if(ArrayBuffer.isView(v)) return v.constructor.name+'['+Array.prototype.join.call(v,',')+']'; if(Array.isArray(v)) return '['+v.map(J).join(',')+']'; if(typeof v==='object') return Object.prototype.toString.call(v); return JSON.stringify(v); }
try{window.__wait=true;var out=[];var c=document.getElementById('c');var gl=ctx('webgl');var ext=gl.getExtension('WEBGL_lose_context');

}catch(e){window.__error=String(e&&e.stack||e);}
</script>
