<!doctype html><meta charset=utf-8><canvas id=c width=256 height=192></canvas>
<script src="vendor/regl.min.js"></script>
<script>
try {
  var regl = createREGL({canvas: document.getElementById('c'), attributes: {antialias: false, preserveDrawingBuffer: true}});
  regl.clear({color: [0.1, 0.12, 0.2, 1], depth: 1});
  var draw = regl({
    frag: 'precision mediump float; varying vec3 vc; void main(){ gl_FragColor = vec4(vc, 1.0); }',
    vert: 'precision mediump float; attribute vec2 position; attribute vec3 color; uniform float scale; uniform vec2 offset; varying vec3 vc; void main(){ vc = color; gl_Position = vec4(position*scale + offset, 0.0, 1.0); }',
    attributes: {position: [[-1, -1], [1, -1], [0, 1]], color: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]},
    uniforms: {scale: regl.prop('scale'), offset: regl.prop('offset')},
    count: 3, depth: {enable: false}
  });
  draw([{scale: 0.4, offset: [-0.5, 0.3]}, {scale: 0.3, offset: [0.5, -0.2]}, {scale: 0.2, offset: [0, -0.6]}]);
  var px = regl.read({x: 128, y: 100, width: 2, height: 2});
  window.__result = 'read=' + Array.prototype.join.call(px, ',') + ' ext=' + Object.keys(regl.limits).length;
} catch (e) { window.__error = String(e && (e.message + "\n" + e.stack) || e); }
</script>
