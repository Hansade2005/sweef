<!doctype html><meta charset=utf-8><body style="margin:0"><canvas id=c width=240 height=160></canvas><script>
var c=document.getElementById("c"),x=c.getContext("2d");
x.fillStyle='#fff';x.fillRect(0,0,240,160);x.strokeStyle='#ccc';x.lineWidth=1;x.beginPath();x.moveTo(120,0);x.lineTo(120,160);x.moveTo(0,40);x.lineTo(240,40);x.moveTo(0,110);x.lineTo(240,110);x.stroke();
x.fillStyle='#000';x.font='16px "DejaVu Sans"';
['left','center','right'].forEach(function(a,i){x.textAlign=a;x.fillText(a,120,16+i*10+i*6);});
x.textAlign='left';['top','middle','alphabetic','bottom','hanging'].forEach(function(b,i){x.textBaseline=b;x.fillText(b.slice(0,3),4+i*46,40);});
x.textBaseline='alphabetic';x.textAlign='start';x.fillText('start',10,110);x.textAlign='end';x.fillText('end',230,110);x.direction='rtl';x.textAlign='start';x.fillText('rtl-start',230,140);
</script>
