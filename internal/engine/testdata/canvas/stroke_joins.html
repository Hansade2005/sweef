<!doctype html><meta charset=utf-8><body style="margin:0"><canvas id=c width=240 height=160></canvas><script>
var c=document.getElementById("c"),x=c.getContext("2d");
x.fillStyle='#fff';x.fillRect(0,0,240,160);x.lineWidth=14;x.strokeStyle='#246';
['miter','round','bevel'].forEach(function(j,i){x.lineJoin=j;x.beginPath();x.moveTo(15+i*78,70);x.lineTo(40+i*78,20);x.lineTo(65+i*78,70);x.stroke();x.beginPath();x.moveTo(15+i*78,150);x.lineTo(60+i*78,100);x.lineTo(30+i*78,150);x.stroke();});
</script>
