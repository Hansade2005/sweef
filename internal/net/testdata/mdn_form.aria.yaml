- main:
  - heading "Your first form" [level=1 ref=e103]
  - list:
    - listitem:
      - link "Overview: Web forms" [ref=e104]:
        - /url: /en-US/docs/Learn_web_development/Extensions/Forms
    - listitem:
      - link "Next" [ref=e105]:
        - /url: /en-US/docs/Learn_web_development/Extensions/Forms/How_to_structure_a_web_form
  - paragraph: The first article in our series provides you with your very first experience of creating a web form, including designing a simple form, implementing it using the right HTML form controls and other HTM…
  - figure:
    - table:
      - rowgroup:
        - row:
          - columnheader "Prerequisites:"
          - cell:
            - text: A basic
            - link "understanding of HTML" [ref=e106]:
              - /url: /en-US/docs/Learn_web_development/Core/Structuring_content
            - text: .
        - row:
          - columnheader "Objective:"
          - cell: To gain familiarity with what web forms are, what they are used for, how to think about designing them, and the basic HTML elements you'll need for simple cases.
  - complementary:
    - navigation:
      - heading "In this article" [level=2 ref=e107]
      - list:
        - listitem:
          - link "What are web forms?" [ref=e108]:
            - /url: "#what_are_web_forms"
        - listitem:
          - link "Designing your form" [ref=e109]:
            - /url: "#designing_your_form"
        - listitem:
          - link "Implementing our form HTML" [ref=e110]:
            - /url: "#implementing_our_form_html"
        - listitem:
          - link "Basic form styling" [ref=e111]:
            - /url: "#basic_form_styling"
        - listitem:
          - link "Sending form data to your web server" [ref=e112]:
            - /url: "#sending_form_data_to_your_web_server"
        - listitem:
          - link "Summary" [ref=e113]:
            - /url: "#summary"
  - region "What are web forms?":
    - heading "What are web forms?" [level=2 ref=e114]:
      - link "What are web forms?" [ref=e115]:
        - /url: "#what_are_web_forms"
    - paragraph:
      - strong: Web forms
      - text: are one of the main points of interaction between a user and a website or application. Forms allow users to enter data, which is generally sent to a web server for processing and storage (see
      - link "Sending form data" [ref=e116]:
        - /url: /en-US/docs/Learn_web_development/Extensions/Forms/Sending_and_retrieving_form_data
      - text: later in the module), or used on the client-side to immediately update the interface in some way (for example, add another item to a list, or show or hide a UI feature).
    - paragraph:
      - text: A web form's HTML is made up of one or more
      - strong: form controls
      - text: (sometimes called
      - strong: widgets
      - text: ), plus some additional elements to help structure the overall form — they are often referred to as
      - strong: HTML forms
      - text: . The controls can be single or multi-line text fields, dropdown boxes, buttons, checkboxes, or radio buttons, and are mostly created using the
      - link "<input>" [ref=e117]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/input
      - text: element, although there are some other elements to learn about too.
    - paragraph:
      - text: Form controls can also be programmed to enforce specific formats or values to be entered (
      - strong: form validation
      - text: ), and paired with text labels that describe their purpose to both sighted and visually impaired users.
  - region "Designing your form":
    - heading "Designing your form" [level=2 ref=e118]:
      - link "Designing your form" [ref=e119]:
        - /url: "#designing_your_form"
    - paragraph: Before starting to code, it's always better to step back and take the time to think about your form. Designing a quick mockup will help you to define the right set of data you want to ask your user to…
    - paragraph: Designing forms is an important step when you are building a site or application. It's beyond the scope of this article to cover the user experience of forms, but if you want to dig into that topic yo…
    - list:
      - listitem:
        - text: Smashing Magazine has some
        - link "good articles about forms UX" [ref=e120]:
          - /url: https://www.smashingmagazine.com/2018/08/ux-html5-mobile-form-part-1/
        - text: ", including an older but still relevant"
        - link "Extensive Guide To Web Form Usability" [ref=e121]:
          - /url: https://www.smashingmagazine.com/2011/11/extensive-guide-web-form-usability/
        - text: article.
      - listitem:
        - text: UXMatters is also a very thoughtful resource with good advice from
        - link "basic best practices" [ref=e122]:
          - /url: https://www.uxmatters.com/mt/archives/2012/05/7-basic-best-practices-for-buttons.php
        - text: to complex concerns such as
        - link "multipage forms" [ref=e123]:
          - /url: https://www.uxmatters.com/mt/archives/2010/03/pagination-in-web-forms-evaluating-the-effectiveness-of-web-forms.php
        - text: .
    - paragraph: In this article, we'll build a simple contact form. Let's make a rough sketch.
    - paragraph:
      - img "The form to build, roughly sketch"
    - paragraph: Our form will contain three text fields and one button. We are asking the user for their name, their email and the message they want to send. Hitting the button will send their data to a web server.
  - region "Implementing our form HTML":
    - heading "Implementing our form HTML" [level=2 ref=e124]:
      - link "Implementing our form HTML" [ref=e125]:
        - /url: "#implementing_our_form_html"
    - paragraph:
      - text: "Ok, let's have a go at creating the HTML for our form. We will use the following HTML elements:"
      - link "<form>" [ref=e126]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/form
      - text: ","
      - link "<label>" [ref=e127]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/label
      - text: ","
      - link "<input>" [ref=e128]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/input
      - text: ","
      - link "<textarea>" [ref=e129]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/textarea
      - text: ", and"
      - link "<button>" [ref=e130]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/button
      - text: .
    - paragraph:
      - text: Before you go any further, make a local copy of our
      - link "simple HTML template" [ref=e131]:
        - /url: https://github.com/mdn/learning-area/blob/main/html/introduction-to-html/getting-started/index.html
      - text: — you'll enter your form HTML into here.
  - region "The <form> element":
    - heading "The <form> element" [level=3 ref=e132]:
      - link "The <form> element" [ref=e133]:
        - /url: "#the_form_element"
    - paragraph:
      - text: All forms start with a
      - link "<form>" [ref=e134]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/form
      - text: "element, like this:"
    - text: html
    - code:
      - code: "<form action=\"/my-handling-form-page\" method=\"post\">…</form>"
    - paragraph:
      - text: This element formally defines a form. It's a container element like a
      - link "<section>" [ref=e135]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/section
      - text: or
      - link "<footer>" [ref=e136]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/footer
      - text: element, but specifically for containing forms; it also supports some specific attributes to configure the way the form behaves. All of its attributes are optional, but it's standard practice to alway…
      - link "action" [ref=e137]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/form#action
      - text: and
      - link "method" [ref=e138]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/form#method
      - text: "attributes:"
    - list:
      - listitem:
        - text: The
        - code: action
        - text: attribute defines the location (URL) where the form's collected data should be sent when it is submitted.
      - listitem:
        - text: The
        - code: method
        - text: attribute defines which HTTP method to send the data with (usually
        - code: get
        - text: or
        - code: post
        - text: ).
    - paragraph:
      - strong: "Note:"
      - text: We'll look at how those attributes work in our
      - link "Sending form data" [ref=e139]:
        - /url: /en-US/docs/Learn_web_development/Extensions/Forms/Sending_and_retrieving_form_data
      - text: article later on.
    - paragraph:
      - text: For now, add the above
      - link "<form>" [ref=e140]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/form
      - text: element into your HTML
      - link "<body>" [ref=e141]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/body
      - text: .
  - region "The <label> , <input> , and <textarea> elements":
    - heading "The <label> , <input> , and <textarea> elements" [level=3 ref=e142]:
      - link "The <label> , <input> , and <textarea> elements" [ref=e143]:
        - /url: "#the_label_input_and_textarea_elements"
    - paragraph:
      - text: "Our contact form is not complex: the data entry portion contains three text fields, each with a corresponding"
      - link "<label>" [ref=e144]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/label
      - text: ":"
    - list:
      - listitem:
        - text: The input field for the name is a
        - link "single-line text field" [ref=e145]:
          - /url: /en-US/docs/Web/HTML/Reference/Elements/input/text
        - text: .
      - listitem:
        - text: The input field for the email is an
        - link "input of type email" [ref=e146]:
          - /url: /en-US/docs/Web/HTML/Reference/Elements/input/email
        - text: ": a single-line text field that accepts only email addresses."
      - listitem:
        - text: The input field for the message is a
        - link "<textarea>" [ref=e147]:
          - /url: /en-US/docs/Web/HTML/Reference/Elements/textarea
        - text: ; a multiline text field.
    - paragraph: "In terms of HTML code we need something like the following to implement these form widgets:"
    - text: html
    - code:
      - code: "<form action=\"/my-handling-form-page\" method=\"post\"> <p> <label for=\"name\">Name:</label> <input type=\"text\" id=\"name\" name=\"user_name\" /> </p> <p> <label for=\"mail\">Email:</label> <input type=\"email\" …"
    - paragraph: Update your form code to look like the above.
    - paragraph:
      - text: The
      - link "<p>" [ref=e148]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/p
      - text: elements are there to conveniently structure our code and make styling easier (see later in the article). For usability and accessibility, we include an explicit label for each form control. Note the …
      - link "for" [ref=e149]:
        - /url: /en-US/docs/Web/HTML/Reference/Attributes/for
      - text: attribute on all
      - link "<label>" [ref=e150]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/label
      - text: elements, which takes as its value the
      - link "id" [ref=e151]:
        - /url: /en-US/docs/Web/HTML/Reference/Global_attributes/id
      - text: of the form control with which it is associated — this is how you associate a form control with its label.
    - paragraph:
      - text: There is great benefit to doing this — it associates the label with the form control, enabling mouse, trackpad, and touch device users to click on the label to activate the corresponding control, and …
      - link "How to structure a web form" [ref=e152]:
        - /url: /en-US/docs/Learn_web_development/Extensions/Forms/How_to_structure_a_web_form
      - text: .
    - paragraph:
      - text: On the
      - link "<input>" [ref=e153]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/input
      - text: element, the most important attribute is the
      - code: type
      - text: attribute. This attribute is extremely important because it defines the way the
      - link "<input>" [ref=e154]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/input
      - text: element appears and behaves. You'll find more about this in the
      - link "Basic native form controls" [ref=e155]:
        - /url: /en-US/docs/Learn_web_development/Extensions/Forms/Basic_native_form_controls
      - text: article later on.
    - list:
      - listitem:
        - text: In our simple example, we use the value
        - link "text" [ref=e156]:
          - /url: /en-US/docs/Web/HTML/Reference/Elements/input/text
        - text: for the first input — the default value for this attribute. It represents a basic single-line text field that accepts any kind of text input.
      - listitem:
        - text: For the second input, we use the value
        - link "email" [ref=e157]:
          - /url: /en-US/docs/Web/HTML/Reference/Elements/input/email
        - text: ", which defines a single-line text field that only accepts a well-formed email address. This turns a basic text field into a kind of \"intelligent\" field that will perform some validation checks on the…"
        - link "client-side form validation" [ref=e158]:
          - /url: /en-US/docs/Learn_web_development/Extensions/Forms/Form_validation
        - text: article later on.
    - paragraph:
      - text: Last but not least, note the syntax of
      - code: <input>
      - text: vs.
      - code: <textarea></textarea>
      - text: . This is one of the oddities of HTML. The
      - code: <input>
      - text: tag is a
      - link "void element" [ref=e159]:
        - /url: /en-US/docs/Glossary/Void_element
      - text: ", meaning that it doesn't need a closing tag."
      - link "<textarea>" [ref=e160]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/textarea
      - text: "is not a void element, meaning it should be closed with the proper ending tag. This has an impact on a specific feature of forms: the way you define the default value. To define the default value of a…"
      - link "<input>" [ref=e161]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/input
      - text: element you have to use the
      - link "value" [ref=e162]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/input#value
      - text: "attribute like this:"
    - text: html
    - code:
      - code: "<input type=\"text\" value=\"by default this element is filled with this text\" />"
    - paragraph:
      - text: On the other hand, if you want to define a default value for a
      - link "<textarea>" [ref=e163]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/textarea
      - text: ", you put it between the opening and closing tags of the"
      - link "<textarea>" [ref=e164]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/textarea
      - text: "element, like this:"
    - text: html
    - code:
      - code: <textarea> by default this element is filled with this text </textarea>
  - region "The <button> element":
    - heading "The <button> element" [level=3 ref=e165]:
      - link "The <button> element" [ref=e166]:
        - /url: "#the_button_element"
    - paragraph:
      - text: "The markup for our form is almost complete; we just need to add a button to allow the user to send, or \"submit\", their data once they have filled out the form. This is done by using the"
      - link "<button>" [ref=e167]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/button
      - text: element; add the following just above the closing
      - code: </form>
      - text: "tag:"
    - text: html
    - code:
      - code: "<p class=\"button\"> <button type=\"submit\">Send your message</button> </p>"
    - paragraph:
      - text: The
      - link "<button>" [ref=e168]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/button
      - text: element also accepts a
      - code: type
      - text: "attribute — this accepts one of three values:"
      - code: submit
      - text: ","
      - code: reset
      - text: ", or"
      - code: button
      - text: .
    - list:
      - listitem:
        - text: A click on a
        - code: submit
        - text: button (the default value) sends the form's data to the web page defined by the
        - code: action
        - text: attribute of the
        - link "<form>" [ref=e169]:
          - /url: /en-US/docs/Web/HTML/Reference/Elements/form
        - text: element.
      - listitem:
        - text: A click on a
        - code: reset
        - text: button resets all the form widgets to their default value immediately. From a UX point of view, this is considered bad practice, so you should avoid using this type of button unless you really have a …
      - listitem:
        - text: A click on a
        - code: button
        - text: button does
        - emphasis: nothing
        - text: "! That sounds silly, but it's amazingly useful for building custom buttons — you can define their chosen functionality with JavaScript."
    - paragraph:
      - strong: "Note:"
      - text: You can also use the
      - link "<input>" [ref=e170]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/input
      - text: element with the corresponding
      - code: type
      - text: to produce a button, for example
      - code: "<input type=\"submit\">"
      - text: . The main advantage of the
      - link "<button>" [ref=e171]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/button
      - text: element is that the
      - link "<input>" [ref=e172]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/input
      - text: element only allows plain text in its label whereas the
      - link "<button>" [ref=e173]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/button
      - text: element allows full HTML content, allowing more complex, creative button content.
  - region "Basic form styling":
    - heading "Basic form styling" [level=2 ref=e174]:
      - link "Basic form styling" [ref=e175]:
        - /url: "#basic_form_styling"
    - paragraph: Now that you have finished writing your form's HTML code, try saving it and looking at it in a browser. At the moment, you'll see that it looks rather ugly.
    - paragraph:
      - strong: "Note:"
      - text: If you don't think you've got the HTML code right, try comparing it with our finished example — see
      - link "first-form.html" [ref=e176]:
        - /url: https://github.com/mdn/learning-area/blob/main/html/forms/your-first-HTML-form/first-form.html
      - text: (
      - link "also see it live" [ref=e177]:
        - /url: https://mdn.github.io/learning-area/html/forms/your-first-HTML-form/first-form.html
      - text: ).
    - paragraph: Forms are notoriously tricky to style nicely. It is beyond the scope of this article to teach you form styling in detail, so for the moment we will just get you to add some CSS to make it look OK.
    - paragraph:
      - text: First of all, add a
      - link "<style>" [ref=e178]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/style
      - text: "element to your page, inside your HTML head. It should look like so:"
    - text: html
    - code:
      - code: <style> /* CSS goes here */ </style>
    - paragraph:
      - text: Inside the
      - code: style
      - text: "tags, add the following CSS:"
    - text: css
    - code:
      - code: "body { /* Center the form on the page */ text-align: center; } form { display: inline-block; /* Form outline */ padding: 1em; border: 1px solid #cccccc; border-radius: 1em; } p + p { margin-top: 1em; …"
    - paragraph: Save and reload, and you'll see that your form should look much less ugly.
    - paragraph:
      - strong: "Note:"
      - text: You can find our version on GitHub at
      - link "first-form-styled.html" [ref=e179]:
        - /url: https://github.com/mdn/learning-area/blob/main/html/forms/your-first-HTML-form/first-form-styled.html
      - text: (
      - link "also see it live" [ref=e180]:
        - /url: https://mdn.github.io/learning-area/html/forms/your-first-HTML-form/first-form-styled.html
      - text: ).
  - region "Sending form data to your web server":
    - heading "Sending form data to your web server" [level=2 ref=e181]:
      - link "Sending form data to your web server" [ref=e182]:
        - /url: "#sending_form_data_to_your_web_server"
    - paragraph:
      - text: The last part, and perhaps the trickiest, is to handle form data on the server side. The
      - link "<form>" [ref=e183]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/form
      - text: element defines where and how to send the data thanks to the
      - link "action" [ref=e184]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/form#action
      - text: and
      - link "method" [ref=e185]:
        - /url: /en-US/docs/Web/HTML/Reference/Elements/form#method
      - text: attributes.
    - paragraph:
      - text: We provide a
      - code: name
      - text: attribute for each form control. The names are important on both the client- and server-side; they tell the browser which name to give each piece of data and, on the server side, they let the server h…
    - paragraph:
      - text: To name the data in a form, you need to use the
      - code: name
      - text: "attribute on each form widget that will collect a specific piece of data. Let's look at some of our form code again:"
    - text: html
    - code:
      - code: "<form action=\"/my-handling-form-page\" method=\"post\"> <p> <label for=\"name\">Name:</label> <input type=\"text\" id=\"name\" name=\"user_name\" /> </p> <p> <label for=\"mail\">Email:</label> <input type=\"email\" …"
    - paragraph:
      - text: In our example, the form will send 3 pieces of data named
      - code: user_name
      - text: ","
      - code: user_email
      - text: ", and"
      - code: user_message
      - text: . That data will be sent to the URL
      - code: /my-handling-form-page
      - text: using the
      - link "HTTP POST" [ref=e186]:
        - /url: /en-US/docs/Web/HTTP/Reference/Methods/POST
      - text: method.
    - paragraph:
      - text: On the server side, the script at the URL
      - code: /my-handling-form-page
      - text: will receive the data as a list of 3 key/value items contained in the HTTP request. The way this script will handle that data is up to you. Each server-side language (PHP, Python, Ruby, Java, C#, etc.…
      - link "Sending form data" [ref=e187]:
        - /url: /en-US/docs/Learn_web_development/Extensions/Forms/Sending_and_retrieving_form_data
      - text: article later on.
  - region "Summary":
    - heading "Summary" [level=2 ref=e188]:
      - link "Summary" [ref=e189]:
        - /url: "#summary"
    - paragraph: "Congratulations, you've built your first web form. It looks like this live:"
    - code:
      - code: "<form action=\"/my-handling-form-page\" method=\"post\"> <div> <label for=\"name\">Name:</label> <input type=\"text\" id=\"name\" name=\"user_name\" /> </div> <div> <label for=\"mail\">Email:</label> <input type=\"e…"
    - code:
      - code: "document.querySelector(\"form\").addEventListener(\"submit\", (event) => { event.preventDefault(); });"
    - code:
      - code: "form { /* Just to center the form on the page */ margin: 0 auto; width: 400px; /* To see the limits of the form */ padding: 1em; border: 1px solid #cccccc; border-radius: 1em; } div + div { margin-top…"
    - iframe "Summary sample"
    - paragraph: That's only the beginning, however — now it's time to take a deeper look. Forms have way more power than what we saw here and the other articles in this module will help you to master the rest.
    - list:
      - listitem:
        - link "Overview: Web forms" [ref=e190]:
