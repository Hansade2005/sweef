    - text: "]"
    - paragraph:
      - text: Go was designed at
      - link "Google" [ref=e286]:
        - /url: https://en.wikipedia.org/wiki/Google
      - text: in 2007 to improve
      - link "programming productivity" [ref=e287]:
        - /url: https://en.wikipedia.org/wiki/Programming_productivity
      - text: in an era of
      - link "multicore" [ref=e288]:
        - /url: https://en.wikipedia.org/wiki/Multi-core_processor
