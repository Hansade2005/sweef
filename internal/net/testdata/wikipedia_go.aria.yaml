    - text: ","
    - link "general-purpose programming language" [ref=e252]:
      - /url: https://en.wikipedia.org/wiki/General_purpose_programming_language
    - text: that is
    - link "statically typed" [ref=e253]:
      - /url: https://en.wikipedia.org/wiki/Static_typing
    - text: and
    - link "compiled" [ref=e254]:
      - /url: https://en.wikipedia.org/wiki/Compiled_language
    - text: . Originally designed in 2007 by
    - link "Robert Griesemer" [ref=e255]:
      - /url: https://en.wikipedia.org/wiki/Robert_Griesemer
    - text: ","
    - link "Rob Pike" [ref=e256]:
      - /url: https://en.wikipedia.org/wiki/Rob_Pike
    - text: ", and"
    - link "Ken Thompson" [ref=e257]:
      - /url: https://en.wikipedia.org/wiki/Ken_Thompson
    - text: ", Go was publicly announced in November 2009,"
    - superscript:
      - link "[ 16 ]" [ref=e258]:
        - /url: "#cite_note-techcrunch-16"
    - superscript:
      - link "[ 4 ]" [ref=e259]:
        - /url: "#cite_note-langfaq-4"
    - text: and is developed by
    - link "Google" [ref=e260]:
      - /url: https://en.wikipedia.org/wiki/Google
    - superscript:
      - link "[ 5 ]" [ref=e261]:
        - /url: "#cite_note-Claburn-2022-5"
    - text: and community contributors. Go has a simple
    - link "syntax" [ref=e262]:
