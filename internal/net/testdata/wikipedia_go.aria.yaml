        - text: and
        - link "usability" [ref=e298]:
          - /url: https://en.wikipedia.org/wiki/Usability
        - text: (like
        - link "Python" [ref=e299]:
          - /url: https://en.wikipedia.org/wiki/Python_(programming_language)
        - text: )
        - superscript:
          - link "[ 26 ]" [ref=e300]:
            - /url: "#cite_note-26"
      - listitem:
        - text: High-performance
        - link "networking" [ref=e301]:
          - /url: https://en.wikipedia.org/wiki/Computer_network
        - text: and
        - link "multiprocessing" [ref=e302]:
          - /url: https://en.wikipedia.org/wiki/Multiprocessing
    - paragraph:
      - text: Its designers were primarily motivated by their shared dislike of
      - link "C++" [ref=e303]:
        - /url: https://en.wikipedia.org/wiki/C++
      - text: .
      - superscript:
        - link "[ 27 ]" [ref=e304]:
