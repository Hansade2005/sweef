    - region "Syntax":
      - heading "Syntax" [level=3 ref=e385]
      - text: "["
      - link "edit" [ref=e386]:
        - /url: /w/index.php?title=Go_(programming_language)&action=edit&section=6
      - text: "]"
      - paragraph:
        - text: Go's syntax includes changes from
        - link "C" [ref=e387]:
          - /url: https://en.wikipedia.org/wiki/C_(programming_language)
        - text: aimed at keeping code concise and readable. A combined declaration/initialization operator was introduced that allows the programmer to write
        - code: i := 3
        - text: or
        - code: "s := \"Hello, world!\""
        - text: ","
        - link "without specifying the types" [ref=e388]:
          - /url: https://en.wikipedia.org/wiki/Type_inference
        - text: of variables used. This contrasts with C's
        - code: int i = 3 ;
        - text: and
        - code: "char * s = \"Hello, world!\" ;"
        - text: (though since
        - link "C23" [ref=e389]:
          - /url: https://en.wikipedia.org/wiki/C23_(C_standard_revision)
        - text: type inference has been supported using
        - code: auto
        - text: ", like"
        - link "C++" [ref=e390]:
          - /url: https://en.wikipedia.org/wiki/C++
        - text: ). Go also removes the requirement to use parentheses in
        - code: if
        - text: statement conditions.
      - paragraph:
        - text: Semicolons still terminate statements;
        - superscript:
          - link "[ b ]" [ref=e391]:
            - /url: "#cite_note-61"
        - text: but are implicit when the end of a line occurs.
        - superscript:
          - link "[ c ]" [ref=e392]:
            - /url: "#cite_note-63"
      - paragraph:
        - text: Methods may return multiple values, and returning a
        - code: result , err
        - text: pair is the conventional way a method indicates an error to its caller in Go.
        - superscript:
          - link "[ d ]" [ref=e393]:
            - /url: "#cite_note-64"
        - text: Go adds literal syntaxes for initializing struct parameters by name and for initializing
        - link "maps" [ref=e394]:
          - /url: https://en.wikipedia.org/wiki/Associative_array
        - text: and
        - link "slices" [ref=e395]:
          - /url: https://en.wikipedia.org/wiki/Array_slicing
        - text: . As an alternative to C's three-statement
        - code: for
        - text: loop, Go's
        - code: range
        - text: expressions allow concise iteration over arrays, slices, strings, maps, and channels.
        - superscript:
          - link "[ 61 ]" [ref=e396]:
            - /url: "#cite_note-65"
