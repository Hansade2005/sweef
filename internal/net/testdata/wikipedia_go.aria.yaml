          - /url: "#cite_note-28"
      - superscript:
        - link "[ 29 ]" [ref=e306]:
          - /url: "#cite_note-29"
    - paragraph:
      - text: Go was publicly announced in November 2009,
      - superscript:
        - link "[ 30 ]" [ref=e307]:
          - /url: "#cite_note-30"
      - text: and version 1.0 was released in March 2012.
      - superscript:
        - link "[ 31 ]" [ref=e308]:
          - /url: "#cite_note-31"
      - superscript:
        - link "[ 32 ]" [ref=e309]:
          - /url: "#cite_note-32"
      - text: Go is widely used in production at Google
      - superscript:
        - link "[ 33 ]" [ref=e310]:
          - /url: "#cite_note-faq-33"
      - text: and in many other organizations and open-source projects.
    - paragraph:
      - text: Go developers implemented runtime support for
      - link "concurrency" [ref=e311]:
        - /url: https://en.wikipedia.org/wiki/Concurrency_(computer_science)
      - text: in response to the availability of
      - link "multicore" [ref=e312]:
        - /url: https://en.wikipedia.org/wiki/Multicore
      - text: "systems:"
    - blockquote:
      - paragraph:
        - text: Although the design of most languages concentrates on innovations in syntax, semantics, or typing, Go is focused on the software development process itself. ... The principal unusual property of the l…
        - superscript:
          - link "[ 34 ]" [ref=e313]:
            - /url: "#cite_note-34"
    - paragraph:
      - text: As of April 2022, each
      - link "commit" [ref=e314]:
        - /url: https://en.wikipedia.org/wiki/Commit_(version_control)
      - text: to the Go repository must be approved by two Google employees.
      - superscript:
        - link "[ 5 ]" [ref=e315]:
          - /url: "#cite_note-Claburn-2022-5"
    - region "Branding and styling":
      - heading "Branding and styling" [level=3 ref=e316]
      - text: "["
      - link "edit" [ref=e317]:
        - /url: /w/index.php?title=Go_(programming_language)&action=edit&section=2
      - text: "]"
      - figure:
        - link [ref=e318]:
          - /url: https://en.wikipedia.org/wiki/File:Golang.png
        - text: A drawing of Go's mascot, a cartoon
        - link "gopher" [ref=e319]:
          - /url: https://en.wikipedia.org/wiki/Gopher
        - text: .
      - paragraph:
        - text: The
        - link "gopher" [ref=e320]:
          - /url: https://en.wikipedia.org/wiki/Gopher
        - link "mascot" [ref=e321]:
          - /url: https://en.wikipedia.org/wiki/Mascot
        - text: was introduced in 2009 for the
        - link "open source" [ref=e322]:
          - /url: https://en.wikipedia.org/wiki/Open_source
        - text: launch of the language.
        - link "Renée French" [ref=e323]:
          - /url: https://en.wikipedia.org/wiki/Renée_French
        - text: ", who had designed the rabbit mascot for"
        - link "Plan 9" [ref=e324]:
          - /url: https://en.wikipedia.org/wiki/Plan_9_from_Bell_Labs
        - text: ", adapted the gopher from an earlier"
        - link "WFMU" [ref=e325]:
          - /url: https://en.wikipedia.org/wiki/WFMU
        - text: T-shirt design.
        - superscript:
          - link "[ 35 ]" [ref=e326]:
            - /url: "#cite_note-goGopher-35"
        - text: The gopher was originally named Gordon,
        - superscript:
          - link "[ 16 ]" [ref=e327]:
            - /url: "#cite_note-techcrunch-16"
        - superscript:
          - link "[ a ]" [ref=e328]:
            - /url: "#cite_note-36"
        - text: but it has been nameless
        - superscript:
          - link "[ 35 ]" [ref=e329]:
            - /url: "#cite_note-goGopher-35"
        - text: since 2010.
        - superscript:
          - link "[ 36 ]" [ref=e330]:
            - /url: "#cite_note-37"
      - paragraph:
        - text: In November 2016, the Go and Go Mono fonts were released by type designers
        - link "Charles Bigelow" [ref=e331]:
          - /url: https://en.wikipedia.org/wiki/Charles_Bigelow_(type_designer)
        - text: and
        - link "Kris Holmes" [ref=e332]:
          - /url: https://en.wikipedia.org/wiki/Kris_Holmes
        - text: specifically for use by the Go project. Go is a
        - link "humanist sans-serif" [ref=e333]:
          - /url: https://en.wikipedia.org/wiki/Humanist_sans-serif
        - text: resembling
        - link "Lucida Grande" [ref=e334]:
          - /url: https://en.wikipedia.org/wiki/Lucida_Grande
        - text: but with near (not full) metric compatibility with
        - link "Helvetica" [ref=e335]:
          - /url: https://en.wikipedia.org/wiki/Helvetica
        - text: and
        - link "Arial" [ref=e336]:
          - /url: https://en.wikipedia.org/wiki/Arial
        - text: ", and Go Mono is"
        - link "monospaced" [ref=e337]:
          - /url: https://en.wikipedia.org/wiki/Monospaced
        - text: . Both fonts adhere to the
        - link "WGL4" [ref=e338]:
          - /url: https://en.wikipedia.org/wiki/WGL4
        - text: character set and were designed to be legible with a large
        - link "x-height" [ref=e339]:
          - /url: https://en.wikipedia.org/wiki/X-height
        - text: and distinct
        - link "letterforms" [ref=e340]:
          - /url: https://en.wikipedia.org/wiki/Letterform
        - text: . Both Go and Go Mono adhere to the
        - link "DIN" [ref=e341]:
          - /url: https://en.wikipedia.org/wiki/DIN
        - text: 1450 standard by having a slashed zero, lowercase
        - code: l
        - text: with a tail, and an uppercase
        - code: I
        - text: with serifs.
        - superscript:
          - link "[ 37 ]" [ref=e342]:
            - /url: "#cite_note-38"
        - superscript:
          - link "[ 38 ]" [ref=e343]:
            - /url: "#cite_note-39"
      - paragraph:
        - text: In April 2018, the original logo was redesigned by brand designer Adam Smith. The new logo is a modern, stylized GO slanting right with trailing streamlines. The gopher mascot remained the same.
        - superscript:
          - link "[ 39 ]" [ref=e344]:
            - /url: "#cite_note-40"
    - region "Generics":
      - heading "Generics" [level=3 ref=e345]
      - text: "["
      - link "edit" [ref=e346]:
        - /url: /w/index.php?title=Go_(programming_language)&action=edit&section=3
      - text: "]"
      - paragraph:
        - text: The lack of support for
        - link "generic programming" [ref=e347]:
          - /url: https://en.wikipedia.org/wiki/Generic_programming
        - text: in initial versions of Go drew considerable criticism.
        - superscript:
          - link "[ 40 ]" [ref=e348]:
            - /url: "#cite_note-41"
        - text: The designers expressed an openness to generic programming and noted that built-in functions were in fact type-generic, but are treated as special cases; Pike called this a weakness that might be changed at some point.
        - superscript:
          - link "[ 41 ]" [ref=e349]:
            - /url: "#cite_note-append-42"
        - text: The Google team built at least one compiler for an experimental Go dialect with generics, but did not release it.
        - superscript:
          - link "[ 42 ]" [ref=e350]:
            - /url: "#cite_note-43"
      - paragraph:
        - text: In August 2018, the Go principal contributors published draft designs for generic programming and
        - link "error handling" [ref=e351]:
          - /url: https://en.wikipedia.org/wiki/Exception_handling
        - text: and asked users to submit feedback.
        - superscript:
          - link "[ 43 ]" [ref=e352]:
            - /url: "#cite_note-44"
        - superscript:
          - link "[ 44 ]" [ref=e353]:
            - /url: "#cite_note-45"
        - text: However, the error handling proposal was eventually abandoned.
        - superscript:
          - link "[ 45 ]" [ref=e354]:
            - /url: "#cite_note-46"
      - paragraph:
        - text: In June 2020, a new draft design document
        - superscript:
          - link "[ 46 ]" [ref=e355]:
            - /url: "#cite_note-47"
        - text: was published that would add the necessary syntax to Go for declaring generic functions and types. A code translation tool, go2go , was provided to allow users to try the new syntax, along with a generics-enabled version of the online Go Playground.
        - superscript:
          - link "[ 47 ]" [ref=e356]:
            - /url: "#cite_note-48"
      - paragraph:
        - text: Generics were finally added to Go in version 1.18 on March 15, 2022.
        - superscript:
          - link "[ 48 ]" [ref=e357]:
            - /url: "#cite_note-49"
    - region "Versioning":
      - heading "Versioning" [level=3 ref=e358]
      - text: "["
      - link "edit" [ref=e359]:
        - /url: /w/index.php?title=Go_(programming_language)&action=edit&section=4
      - text: "]"
      - paragraph:
        - text: Go 1 guarantees compatibility
        - superscript:
          - link "[ 49 ]" [ref=e360]:
            - /url: "#cite_note-50"
        - text: for the language specification and major parts of the standard library. All versions up through the current Go 1.26 release
        - superscript:
          - link "[ 50 ]" [ref=e361]:
            - /url: "#cite_note-51"
        - text: have maintained this promise.
      - paragraph:
        - text: Go uses a
        - code: go1.[major].[patch]
        - text: versioning format, such as
        - code: go1.26.0
        - text: and each major Go release is supported until there are two newer major releases. Unlike most software, Go calls the second number in a version the major, i.e., in
        - code: go1.26.0
        - text: the
        - code: 26
        - text: is the major version.
        - superscript:
          - link "[ 51 ]" [ref=e362]:
            - /url: "#cite_note-52"
        - text: This is because Go plans to never reach 2.0, prioritizing backwards compatibility over potential breaking changes.
        - superscript:
          - link "[ 52 ]" [ref=e363]:
            - /url: "#cite_note-53"
  - region "Design":
    - heading "Design" [level=2 ref=e364]
    - text: "["
