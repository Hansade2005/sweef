        - link "[ 53 ]" [ref=e369]:
          - /url: "#cite_note-54"
      - superscript:
        - text: "["
        - link "failed verification" [ref=e370]:
          - /url: https://en.wikipedia.org/wiki/Wikipedia:Verifiability
        - text: –
        - link "see discussion" [ref=e371]:
          - /url: https://en.wikipedia.org/wiki/Talk:Go_(programming_language)#Plan_9_C
        - text: "]"
      - text: "), but with an emphasis on greater simplicity and safety. It consists of:"
    - list:
      - listitem:
        - text: A syntax and environment adopting patterns more common in
        - link "dynamic languages" [ref=e372]:
          - /url: https://en.wikipedia.org/wiki/Dynamic_programming_language
        - text: ":"
        - superscript:
          - link "[ 54 ]" [ref=e373]:
            - /url: "#cite_note-go_lang_video_2009-55"
        - list:
          - listitem:
            - text: Optional concise variable declaration and initialization through
            - link "type inference" [ref=e374]:
              - /url: https://en.wikipedia.org/wiki/Type_inference
            - text: (
            - code: x := 0
            - text: instead of
            - code: var x int = 0 ;
            - text: or
            - code: var x = 0 ;
            - text: )
          - listitem:
            - text: Fast compilation
            - superscript:
              - link "[ 55 ]" [ref=e375]:
                - /url: "#cite_note-techtalk-compiling-56"
          - listitem:
            - text: Remote package management (
            - code: go get
            - text: )
            - superscript:
              - link "[ 56 ]" [ref=e376]:
                - /url: "#cite_note-57"
            - text: and online package documentation
            - superscript:
              - link "[ 57 ]" [ref=e377]:
                - /url: "#cite_note-58"
      - listitem:
        - text: "Distinctive approaches to particular problems:"
        - list:
          - listitem:
            - text: "Built-in concurrency primitives:"
            - link "light-weight processes" [ref=e378]:
              - /url: https://en.wikipedia.org/wiki/Light-weight_process
            - text: (goroutines),
            - link "channels" [ref=e379]:
              - /url: https://en.wikipedia.org/wiki/Channel_(programming)
            - text: ", and the"
            - code: select
            - text: statement
          - listitem:
            - text: An
            - link "interface" [ref=e380]:
              - /url: https://en.wikipedia.org/wiki/Protocol_(object-oriented_programming)
            - text: system in place of
            - link "virtual inheritance" [ref=e381]:
              - /url: https://en.wikipedia.org/wiki/Virtual_inheritance
            - text: ", and type embedding instead of non-virtual inheritance"
          - listitem:
            - text: A toolchain that, by default, produces
            - link "statically linked" [ref=e382]:
              - /url: https://en.wikipedia.org/wiki/Static_library
            - text: native binaries without external Go dependencies
      - listitem:
        - text: A desire to keep the language specification simple enough to hold in a programmer's head,
        - superscript:
          - link "[ 58 ]" [ref=e383]:
            - /url: "#cite_note-59"
        - text: in part by
        - link "omitting features that are common in similar languages" [ref=e384]:
          - /url: "#Omissions"
        - text: .
