        - /url: https://en.wikipedia.org/wiki/Computer
      - text: and large
      - link "codebases" [ref=e291]:
        - /url: https://en.wikipedia.org/wiki/Codebase
      - text: .
      - superscript:
        - link "[ 24 ]" [ref=e292]:
          - /url: "#cite_note-24"
      - text: "The designers wanted to address criticisms of other languages in use at Google, but keep their useful characteristics:"
      - superscript:
        - link "[ 25 ]" [ref=e293]:
          - /url: "#cite_note-25"
    - list:
      - listitem:
        - link "Static typing" [ref=e294]:
          - /url: https://en.wikipedia.org/wiki/Static_typing
        - text: and
        - link "run-time" [ref=e295]:
