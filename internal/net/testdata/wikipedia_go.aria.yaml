    - text: "]"
    - figure: 2015 lecture of Rob Pike (one of the Go creators)
    - paragraph:
      - text: Go is influenced by
      - link "C" [ref=e366]:
        - /url: https://en.wikipedia.org/wiki/C_(programming_language)
      - text: (especially the
      - link "Plan 9" [ref=e367]:
