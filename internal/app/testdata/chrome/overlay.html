<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sweef placeholder overlay</title>
<style>
  html, body { margin: 0; background: transparent; }
  #glow { position: absolute; border: 4px solid #ff2d95; box-sizing: border-box; display: none; }
  #pill { position: absolute; padding: 8px 14px; background: #ff2d95; color: #fff; border-radius: 16px; font: 13px sans-serif; display: none; }
</style>
</head>
<body>
<div id="glow"></div><div id="pill"></div>
<script>
var glow = document.getElementById('glow'), pill = document.getElementById('pill');
function hit(show) {
  var rects = [];
  if (show) { var r = pill.getBoundingClientRect(); rects.push({ x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height) }); }
  sweef.post('overlay.hit', { rects: rects });
}
sweef.onMessage = function (type, p) {
  if (type !== 'overlay') return;
  var on = p.state && p.state !== 'off', v = p.viewport || { x: 0, y: 0, w: 100, h: 100 };
  glow.style.display = on ? 'block' : 'none'; pill.style.display = on ? 'block' : 'none';
  if (on) {
    glow.style.left = v.x + 'px'; glow.style.top = v.y + 'px'; glow.style.width = v.w + 'px'; glow.style.height = v.h + 'px';
    pill.textContent = p.state + ': ' + (p.task || '') + ' ' + (p.step || '');
    pill.style.left = (v.x + 40) + 'px'; pill.style.top = (v.y + v.h - 60) + 'px';
  }
  hit(on);
};
sweef.post('ui.ready', { page: 'overlay' });
</script>
</body>
</html>
