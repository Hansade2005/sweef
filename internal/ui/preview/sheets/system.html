<!doctype html>
<html><head><meta charset="utf-8"><title>Sweef design system</title>
<link rel="stylesheet" href="/shared/tokens.css"><link rel="stylesheet" href="/shared/base.css"><link rel="stylesheet" href="/shared/omni.css">
<style>
body{padding:28px 36px;background:var(--paper)} h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin:26px 0 12px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .sw{width:84px} .sw i{display:block;height:46px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)} .sw b{display:block;font-size:11px;margin-top:5px;font-weight:600} .sw span{font-size:10.5px;color:var(--text-3);font-family:var(--mono)}
.ico{width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;color:var(--text-3);padding:8px 0;border-radius:10px} .ico .ic{color:var(--text)}
.sh{width:120px;height:64px;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-2)}
.logos{display:flex;align-items:flex-end;gap:28px}
</style></head><body>
<div class="logos" id="logos"></div>
<h2>Color</h2><div class="row" id="colors"></div>
<h2>Type</h2><div id="type"></div>
<h2>Radii and shadows</h2><div class="row"><div class="sh" style="border-radius:6px;box-shadow:var(--sh-1)">r0 / sh1</div><div class="sh" style="border-radius:10px;box-shadow:var(--sh-2)">r1 / sh2</div><div class="sh" style="border-radius:14px;box-shadow:var(--sh-3)">r2 / sh3</div><div class="sh" style="border-radius:999px;box-shadow:var(--sh-glow)">pill / glow</div></div>
<h2>Controls</h2><div class="row" id="ctl"></div>
<h2>Icons</h2><div class="row" id="icons"></div>
<script src="/shared/strings.js"></script><script src="/shared/dom.js"></script><script src="/shared/icons.js"></script>
<script>
var h=SW.h;
var L=document.getElementById('logos'); L.appendChild(SW.logo(96,'a')); L.appendChild(SW.logo(48,'b')); L.appendChild(SW.logo(24,'c')); L.appendChild(SW.logo(16,'d')); L.appendChild(SW.wordmark(56,'e')); L.appendChild(SW.wordmark(24,'f'));
var cols=[['paper','--paper'],['bg','--bg'],['surface','--surface'],['sunken','--sunken'],['text','--text'],['text-2','--text-2'],['text-3','--text-3'],['line','--line-2'],['accent','--accent'],['accent-soft','--accent-soft'],['mint','--mint'],['volt-2','--volt-2'],['ok','--ok'],['warn','--warn'],['danger','--danger'],['ink','--ink']];
cols.forEach(function(c){document.getElementById('colors').appendChild(h('div.sw',h('i',{style:{background:'var('+c[1]+')'}}),h('b',c[0]),h('span',c[1])));});
var g=h('div.sw',{style:{width:'260px'}},h('i',{style:{background:'var(--volt-grad)'}}),h('b','volt gradient'),h('span','agent working, speed moments')); document.getElementById('colors').appendChild(g);
[['3xl 34','--fs-3xl',800],['2xl 24','--fs-2xl',750],['xl 18','--fs-xl',700],['lg 15','--fs-lg',600],['md 13','--fs-md',400],['sm 12','--fs-sm',400],['xs 11','--fs-xs',400]].forEach(function(t){document.getElementById('type').appendChild(h('div',{style:{fontSize:'var('+t[1]+')',fontWeight:t[2],marginBottom:'6px'}},'Sweef is fast, calm and yours  ',h('span.num',{style:{color:'var(--text-3)',fontWeight:400}},t[0]+'px  0123456789')));});
var C=document.getElementById('ctl'); C.appendChild(h('button.btn.primary',{text:'Primary'})); C.appendChild(h('button.btn',{text:'Default'})); C.appendChild(h('button.btn.soft',{text:'Soft'})); C.appendChild(h('button.btn.ghost',{text:'Ghost'})); C.appendChild(h('button.btn.danger',{text:'Danger'}));
C.appendChild(h('button.switch',{role:'switch','aria-checked':'true'})); C.appendChild(h('button.switch',{role:'switch','aria-checked':'false'}));
C.appendChild(h('div.seg',h('button',{'aria-checked':'true',text:'Ask'}),h('button',{text:'Agent'}))); C.appendChild(h('span.chip.accent',SW.icon('spark',14),'Sidekick')); C.appendChild(h('span.chip','page')); C.appendChild(h('span.kbd',{text:'Ctrl'})); C.appendChild(h('span.dot.busy'));C.appendChild(h('span.dot.ok'));C.appendChild(h('span.dot.warn'));
Object.keys(SW.I).forEach(function(k){document.getElementById('icons').appendChild(h('div.ico',SW.icon(k,24),k));});
</script></body></html>
