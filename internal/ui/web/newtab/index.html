<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/shared/omni.css">
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<main id="nt">
  <div id="brand"></div>
  <div id="pillwrap">
    <div id="pill" class="pill">
      <span id="pi" class="pi"></span>
      <div class="pf"><input id="q" type="text" aria-label="Ask or type a URL" autofocus><div id="ghost" class="ogh" aria-hidden="true"></div></div>
      <button id="mic" class="ibtn sm" aria-disabled="true"></button>
      <button id="go" class="gobtn" aria-label="Go"></button>
    </div>
    <div id="od" class="od"></div>
  </div>
  <div id="rows" role="list"></div>
  <div id="sites" role="list" aria-label="Top sites"></div>
  <div id="stats" class="hide"></div>
  <section id="inc" class="hide"></section>
</main>
<script src="/shared/strings.js"></script>
<script src="/shared/dom.js"></script>
<script src="/shared/icons.js"></script>
<script src="/shared/omni.js"></script>
<script src="newtab.js"></script>
</body>
</html>
