<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sweef</title>
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/shared/omni.css">
<link rel="stylesheet" href="chrome.css">
</head>
<body>
<div id="app">
  <header id="band">
    <div id="strip">
      <div id="inset" aria-hidden="true"></div>
      <div id="tabs-wrap"><div id="tabs" role="tablist" aria-label="Tabs"></div></div>
      <button id="newtab" class="ibtn" aria-label="New tab" title="New tab"></button>
      <div id="drag" class="drag"></div>
      <div id="incb" class="incb hide"></div>
      <button id="tabsearch" class="ibtn" aria-label="Search tabs" title="Search tabs"></button>
      <div id="wc" role="group" aria-label="Window controls"></div>
    </div>
    <div id="toolbar" role="toolbar" aria-label="Browser controls">
      <button id="sbtoggle" class="ibtn" aria-pressed="false"></button>
      <button id="back" class="ibtn"></button>
      <button id="fwd" class="ibtn"></button>
      <button id="reload" class="ibtn"></button>
      <div id="omni" class="omni">
        <div class="obar">
          <button id="secbtn" class="secbtn" aria-haspopup="dialog" aria-expanded="false"></button>
          <div class="ofield">
            <input id="url" type="text" aria-label="Address and search bar">
            <div id="ghost" class="ogh" aria-hidden="true"></div>
            <div id="urlview" aria-hidden="true"></div>
          </div>
          <button id="star" class="ibtn sm" aria-pressed="false"></button>
        </div>
        <div id="od" class="od"></div>
      </div>
      <button id="mediabtn" class="mediabtn hide" aria-haspopup="dialog" aria-expanded="false"></button>
      <button id="npbtn" class="mediabtn hide" aria-haspopup="dialog" aria-expanded="false"></button>
      <button id="databtn" class="datachip hide" aria-haspopup="dialog" aria-expanded="false"></button>
      <button id="agentbtn" class="agentbtn" aria-haspopup="false"></button>
      <button id="dlbtn" class="ibtn hide"></button>
      <button id="menubtn" class="ibtn" aria-haspopup="menu" aria-expanded="false"></button>
    </div>
    <div id="bmbar" class="hide"></div>
    <div id="progress" aria-hidden="true"><i></i></div>
  </header>
  <div id="compat" class="hide" role="status"></div>
  <div id="sharebar" class="hide" role="status"></div>
  <main id="main">
    <div id="stage">
      <div id="viewport"></div>
      <section id="devtools" class="hide" aria-label="Developer tools"></section>
    </div>
    <aside id="sidebar" class="hide" aria-label="Sweef Sidekick">
      <div id="rz" role="separator" aria-orientation="vertical" aria-label="Resize panel" tabindex="0"></div>
      <header class="skh">
        <button id="skchat" class="skchat" aria-haspopup="menu"></button>
        <span class="grow"></span>
        <button id="sknew" class="ibtn sm"></button>
        <button id="skclose" class="ibtn sm"></button>
      </header>
      <div id="skrun"><i></i></div>
      <div id="skmsgs" tabindex="-1"><div id="skfeed" role="log" aria-live="polite" aria-relevant="additions text"></div></div>
      <footer class="skf">
        <div id="skchips" class="skchips"></div>
        <div id="sklat" class="sklat hide"></div>
        <div class="comp" id="comp">
          <textarea id="skin" rows="1" aria-label="Message"></textarea>
          <div class="comprow">
            <button id="skplus" class="ibtn sm" aria-haspopup="menu"></button>
            <div id="skmode" class="seg modeseg" role="radiogroup" aria-label="Mode"></div>
            <button id="sksrc" class="srcbtn" aria-haspopup="menu"></button>
            <span class="grow"></span>
            <button id="skmic" class="ibtn sm" aria-disabled="true"></button>
            <button id="sksend" class="sendbtn"></button>
          </div>
        </div>
      </footer>
    </aside>
  </main>
  <div id="find" class="hide" role="search"></div>
</div>
<div id="layer"></div>
<div id="toasts" aria-live="polite" aria-atomic="false"></div>
<script src="/shared/strings.js"></script>
<script src="/shared/dom.js"></script>
<script src="/shared/icons.js"></script>
<script src="/shared/omni.js"></script>
<script src="/shared/scroll.js"></script>
<script src="chrome.js"></script>
</body>
</html>
