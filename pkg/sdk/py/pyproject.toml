[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sweef-browser"
version = "0.1.0"
description = "Sweef Browser Python SDK — Playwright-style automation over the SWF1 socket protocol"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["browser", "automation", "ai-agents", "mcp", "playwright", "headless"]

[tool.setuptools.packages.find]
include = ["sweef*"]
