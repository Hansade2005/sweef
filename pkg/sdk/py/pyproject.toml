[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sweef-browser"
version = "0.2.2"
description = "Python SDK for Sweef, the lightweight browser engine for AI agents: Playwright-shaped, synchronous, standard library only"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["browser", "automation", "ai-agents", "mcp", "playwright", "headless", "scraping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.scripts]
sweef = "sweef.cli:main"
sweef-install = "sweef.cli:install_main"

[project.urls]
Homepage = "https://github.com/sweefbrowser/sweef"
Source = "https://github.com/sweefbrowser/sweef/tree/main/pkg/sdk/py"
Issues = "https://github.com/sweefbrowser/sweef/issues"

[tool.setuptools.packages.find]
include = ["sweef*"]

[tool.setuptools.package-data]
sweef = ["py.typed"]
